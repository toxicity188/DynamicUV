name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^project_version=//p' gradle.properties | tr -d '\r')
          if [[ -z "$version" || "$RELEASE_TAG" != "$version" ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must match project_version '$version'."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test library
        id: build
        run: bash gradlew :library:build --stacktrace

      - name: Publish to Maven Central
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: bash gradlew :library:publishAndReleaseToMavenCentral --stacktrace

      - name: Publish to GitHub Packages
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          PACKAGES_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash gradlew :library:publishAllPublicationsToGitHubPackagesRepository --stacktrace
